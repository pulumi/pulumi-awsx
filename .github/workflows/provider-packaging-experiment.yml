# This hand-authored workflow is temporary evidence for pulumi/pulumi-awsx#2130.
# It is not generated by ci-mgmt and must be removed or reduced before merge.
name: Provider packaging experiment

on:
  workflow_dispatch: {}
  pull_request:
    paths:
      - .github/workflows/provider-packaging-experiment.yml
      - awsx/package.json
      - awsx/scripts/build.sh
      - awsx/scripts/strip-pe-certificate.js
      - awsx/yarn.lock
      - mise.toml
      - scripts/smoke-provider.mjs
      - scripts/smoke-provider.sh

permissions:
  contents: read

concurrency:
  group: provider-packaging-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build ${{ matrix.os }}-${{ matrix.arch }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: linux
            arch: amd64
          - os: linux
            arch: arm64
          - os: darwin
            arch: amd64
          - os: darwin
            arch: arm64
          - os: windows
            arch: amd64
          - os: windows
            arch: arm64
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24.20.0
          cache: yarn
          cache-dependency-path: awsx/yarn.lock
      - name: Install Yarn
        run: npm install --global yarn@1.22.22
      - name: Install macOS signing tool
        uses: MOZGIII/install-ldid-action@d5ab465f3a66a4d60a59882b935eb30e18e8d043 # v1
        with:
          tag: v2.1.5-procursus2
      - name: Build provider
        env:
          ARCH: ${{ matrix.arch }}
          OS: ${{ matrix.os }}
          OUT: ${{ github.workspace }}/artifacts/pulumi-resource-awsx${{ matrix.os == 'windows' && '.exe' || '' }}
          SCHEMA: ${{ runner.temp }}/schema.json
        run: |
          mkdir -p artifacts
          jq '.version = "0.0.0"' provider/cmd/pulumi-resource-awsx/schema.json > "$SCHEMA"
          start=$SECONDS
          (cd awsx && ./scripts/build.sh)
          duration=$((SECONDS - start))
          binary="artifacts/pulumi-resource-awsx${{ matrix.os == 'windows' && '.exe' || '' }}"
          sha256sum "$binary" | tee "artifacts/SHA256SUMS"
          size=$(wc -c < "$binary")
          printf 'build_seconds=%s\nsize_bytes=%s\n' "$duration" "$size" | tee artifacts/metrics.txt
          {
            echo "### ${{ matrix.os }}-${{ matrix.arch }}"
            echo
            echo "- Build: ${duration} seconds"
            echo "- Executable: ${size} bytes"
            echo '- SHA-256: `'
            cat artifacts/SHA256SUMS
            echo '`'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Upload provider
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: provider-${{ matrix.os }}-${{ matrix.arch }}
          path: artifacts/
          compression-level: 0
          retention-days: 14

  native-startup:
    name: Start ${{ matrix.os }}-${{ matrix.arch }} natively
    needs: build
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: linux
            arch: amd64
            runner: ubuntu-24.04
          - os: linux
            arch: arm64
            runner: ubuntu-24.04-arm
          - os: darwin
            arch: amd64
            runner: macos-15-intel
          - os: darwin
            arch: arm64
            runner: macos-15
          - os: windows
            arch: amd64
            runner: windows-2025
          - os: windows
            arch: arm64
            runner: windows-11-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Check out smoke test
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Download provider
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: provider-${{ matrix.os }}-${{ matrix.arch }}
          path: artifact
      - name: Start provider five times
        shell: bash
        run: |
          binary="$GITHUB_WORKSPACE/artifact/pulumi-resource-awsx${{ matrix.os == 'windows' && '.exe' || '' }}"
          if [ "${{ matrix.os }}" != windows ]; then
            chmod +x "$binary"
          fi
          node scripts/smoke-provider.mjs "$binary" 5 | tee startup.json
          {
            echo "### Native startup ${{ matrix.os }}-${{ matrix.arch }}"
            echo '```json'
            cat startup.json
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Inspect macOS signature
        if: matrix.os == 'darwin'
        run: |
          set +e
          codesign --verify --deep --strict --verbose=4 artifact/pulumi-resource-awsx 2>&1 | tee signature-verification.txt
          status=${PIPESTATUS[0]}
          codesign --display --verbose=4 artifact/pulumi-resource-awsx 2>&1 | tee signature.txt
          echo "codesign verification status: $status" >> "$GITHUB_STEP_SUMMARY"
          # ldid cross-signatures in the current v3.9.0 release also report that
          # they are valid on disk but do not satisfy their designated requirement.
          exit 0
      - name: Inspect Windows signature
        if: matrix.os == 'windows'
        shell: pwsh
        run: |
          $signature = Get-AuthenticodeSignature artifact/pulumi-resource-awsx.exe
          $signature | Format-List | Out-String | Tee-Object -FilePath signature.txt
          "### Windows signature ${{ matrix.arch }}`n``````text`n$($signature | Format-List | Out-String)``````" >> $env:GITHUB_STEP_SUMMARY

  linux-compatibility:
    name: Linux compatibility ${{ matrix.arch }}
    needs: build
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    steps:
      - name: Check out smoke test
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Download provider
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: provider-linux-${{ matrix.arch }}
          path: artifact
      - name: Inspect ELF dependencies
        run: |
          chmod +x artifact/pulumi-resource-awsx
          file artifact/pulumi-resource-awsx | tee elf-report.txt
          ldd artifact/pulumi-resource-awsx | tee -a elf-report.txt || true
          readelf --version-info artifact/pulumi-resource-awsx \
            | grep -oE 'GLIBC(X{2})?_[0-9.]+' \
            | sort -Vu \
            | tee -a elf-report.txt || true
          {
            echo "### ELF report linux-${{ matrix.arch }}"
            echo '```text'
            cat elf-report.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Test minimal Linux images
        shell: bash
        run: |
          set +e
          required_failed=0
          : > compatibility.txt
          for image in debian:10-slim debian:12-slim pulumi/pulumi-base:latest alpine:3.20; do
            echo "===== $image =====" | tee -a compatibility.txt
            docker run --rm \
              --entrypoint /bin/sh \
              --volume "$GITHUB_WORKSPACE/artifact:/artifact:ro" \
              --volume "$GITHUB_WORKSPACE/scripts:/repo/scripts:ro" \
              "$image" \
              -c 'ldd /artifact/pulumi-resource-awsx 2>&1 || true; /repo/scripts/smoke-provider.sh /artifact/pulumi-resource-awsx' \
              2>&1 | tee -a compatibility.txt
            status=${PIPESTATUS[0]}
            echo "status=$status" | tee -a compatibility.txt
            if [ "$image" != alpine:3.20 ] && [ "$status" -ne 0 ]; then
              required_failed=1
            fi
          done
          {
            echo "### Linux image compatibility ${{ matrix.arch }}"
            echo '```text'
            cat compatibility.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          exit "$required_failed"
