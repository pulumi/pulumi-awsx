# This provider-specific workflow is hand-authored and is not generated by ci-mgmt.
name: AWSX provider artifact compatibility

on:
  workflow_dispatch: {}
  pull_request:
    types:
      - labeled

permissions:
  contents: read

concurrency:
  group: awsx-provider-artifact-compatibility-${{ github.workflow }}-${{ github.ref }}-${{ github.event.label.name || github.event_name }}
  cancel-in-progress: true

jobs:
  prerequisites:
    if: github.event_name == 'workflow_dispatch' ||
      (github.event.label.name == 'run-platform-compatibility' &&
      github.event.pull_request.head.repo.full_name == github.repository)
    permissions:
      contents: read
      pull-requests: write
      id-token: write
    uses: ./.github/workflows/prerequisites.yml
    secrets: inherit
    with:
      default_branch: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.ref || github.event.repository.default_branch }}
      is_pr: ${{ github.event_name == 'pull_request' }}
      is_automated: ${{ github.actor == 'dependabot[bot]' }}
      acceptance_fanout: true

  build_provider:
    needs: prerequisites
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/build_provider.yml
    secrets: inherit
    with:
      version: ${{ needs.prerequisites.outputs.version }}

  native_startup:
    name: Start ${{ matrix.os }}-${{ matrix.arch }} natively
    needs:
      - prerequisites
      - build_provider
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: linux
            arch: amd64
            runner: ubuntu-24.04
            executable: pulumi-resource-awsx
          - os: linux
            arch: arm64
            runner: ubuntu-24.04-arm
            executable: pulumi-resource-awsx
          - os: darwin
            arch: amd64
            runner: macos-15-intel
            executable: pulumi-resource-awsx
          - os: darwin
            arch: arm64
            runner: macos-15
            executable: pulumi-resource-awsx
          - os: windows
            arch: amd64
            runner: windows-2025
            executable: pulumi-resource-awsx.exe
          - os: windows
            arch: arm64
            runner: windows-11-arm
            executable: pulumi-resource-awsx.exe
    steps:
      - name: Check out smoke test
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Download release archive
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: pulumi-resource-awsx-v${{ needs.prerequisites.outputs.version }}-${{ matrix.os }}-${{ matrix.arch }}.tar.gz
          path: artifact
      - name: Extract release archive
        shell: bash
        run: |
          set -euo pipefail
          archive=$(find artifact -type f -name '*.tar.gz' -print -quit)
          test -n "$archive"
          mkdir -p artifact/extracted
          tar -xzf "$archive" -C artifact/extracted
          test -f "artifact/extracted/${{ matrix.executable }}"
      - name: Verify Windows signature
        if: matrix.os == 'windows'
        shell: pwsh
        run: |
          $binary = "artifact/extracted/${{ matrix.executable }}"
          $signature = Get-AuthenticodeSignature -FilePath $binary
          if ($signature.Status -ne "Valid") {
            throw "Invalid Authenticode signature: $($signature.StatusMessage)"
          }
      - name: Prepare isolated Mise configuration
        shell: bash
        run: mkdir -p "$RUNNER_TEMP/awsx-smoke-mise"
      - name: Set up Node for the smoke test
        uses: jdx/mise-action@8d3b0ba20a9cea7b883d922ea958553c941ab082
        with:
          version: 2026.3.7
          add_shims_to_path: false
          cache_save: false
          env: false
          install_args: node
          working_directory: ${{ runner.temp }}/awsx-smoke-mise
          tool_versions: |
            node 24
      - name: Start provider
        shell: bash
        run: |
          set -euo pipefail
          binary="$GITHUB_WORKSPACE/artifact/extracted/${{ matrix.executable }}"
          if [ "${{ matrix.os }}" != windows ]; then
            chmod +x "$binary"
          fi
          mise -C "$RUNNER_TEMP/awsx-smoke-mise" exec -- \
            node "$GITHUB_WORKSPACE/scripts/smoke-provider.mjs" "$binary"
      - name: Start Linux provider in containers
        if: matrix.os == 'linux'
        shell: bash
        run: |
          set -euo pipefail
          name=""
          trap 'if [ -n "$name" ]; then docker rm --force "$name" >/dev/null 2>&1 || true; fi' EXIT
          for image in alpine:3.22 ubuntu:20.04 busybox:1.37-musl; do
            name="awsx-compatibility-${{ matrix.arch }}-${image%%:*}"
            docker pull "$image"
            docker run --detach --name "$name" \
              --volume "$GITHUB_WORKSPACE/artifact/extracted:/provider:ro" \
              "$image" /provider/pulumi-resource-awsx
            for _ in {1..20}; do
              if docker logs "$name" 2>&1 | grep -Eq '^[1-9][0-9]{0,4}$'; then
                break
              fi
              sleep 1
            done
            docker logs "$name" 2>&1 | grep -Eq '^[1-9][0-9]{0,4}$'
            docker rm --force "$name"
            name=""
          done
