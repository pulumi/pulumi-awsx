events {}
http {
    default_type text/plain;
    access_log /dev/stdout;
    error_log /dev/stderr warn;
    server {
        listen 3000;
        location /api/ { return 200 "api-ok__REVISION__\n"; }
        location /admin/ { return 200 "admin-ok__REVISION__\n"; }
        location / { return 404 "backend-default\n"; }
    }
    server {
        listen 3001;
        location = /health { return 200 "healthy\n"; }
    }
}
