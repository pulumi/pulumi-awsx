name: ecs-capacity-providers
runtime: yaml
description: An ECS cluster with capacity providers

resources:
  vpc:
    type: awsx:ec2:Vpc
    properties:
      subnetStrategy: Auto
      natGateways:
        strategy: None
      subnetSpecs:
        - type: Public

  cluster:
    type: aws:ecs:Cluster

  capacityProvider:
    type: aws:ecs:ClusterCapacityProviders
    properties:
      clusterName: ${cluster.name}
      capacityProviders:
        - FARGATE
        - FARGATE_SPOT
      # 4:1 split where 4 of every 5 tasks run on spot. Base of 1 on FARGATE
      # means that we always have at least 1 on FARGATE.
      defaultCapacityProviderStrategies:
        - capacityProvider: FARGATE
          weight: 1
          base: 1
        - capacityProvider: FARGATE_SPOT
          weight: 4

  fargateTask:
    type: awsx:ecs:FargateTaskDefinition
    properties:
      container:
        image: nginx:latest
        name: nginx
        cpu: 512
        memory: 128
        essential: true

  serviceSg:
    type: aws:ec2:SecurityGroup
    properties:
      vpcId: ${vpc.vpcId}
      egress:
        - fromPort: 0
          toPort: 0
          protocol: "-1"
          cidrBlocks:
            - 0.0.0.0/0

  # Uses the cluster's default capacity provider strategy.
  myService:
    type: awsx:ecs:FargateService
    properties:
      cluster: ${cluster.arn}
      taskDefinition: ${fargateTask.taskDefinition.arn}
      useClusterDefaultCapacityProviderStrategy: true
      # The capacity providers must exist on the cluster before the service
      # can reference them.
      continueBeforeSteadyState: true
      networkConfiguration:
        securityGroups:
          - ${serviceSg.id}
        subnets: ${vpc.publicSubnetIds}
        assignPublicIp: true
    options:
      dependsOn:
        - ${capacityProvider}

  # Uses a service-level capacity provider strategy.
  myService2:
    type: awsx:ecs:FargateService
    properties:
      cluster: ${cluster.arn}
      taskDefinition: ${fargateTask.taskDefinition.arn}
      capacityProviderStrategies:
        - capacityProvider: FARGATE
          weight: 1
      continueBeforeSteadyState: true
      networkConfiguration:
        securityGroups:
          - ${serviceSg.id}
        subnets: ${vpc.publicSubnetIds}
        assignPublicIp: true
    options:
      dependsOn:
        - ${capacityProvider}
