[settings]
experimental = true

[hooks]
postinstall = "mise deps install"

[tools]
"pipx:apm-cli" = "0.35.0"
golangci-lint = "2.9.0"
node = '24.22.1'
watchexec = "2.8.0"
# Root mise.toml is the supported repo-local override for versions generated
# into .config/mise.toml by ci-mgmt.
"github:pulumi/schema-tools" = "0.7.1"

[deps.pulumi-yaml]
sources = ["mise.toml"]
outputs = [".pulumi/plugins/converter-yaml-v1.35.0/"]
run = "pulumi plugin install converter yaml 1.35.0"

[deps.agent-skills]
sources = ["apm.yml", "apm.lock.yaml"]
outputs = [
  "apm_modules/",
  ".agents/skills/",
  ".claude/skills/",
]
run = "apm install --frozen"
